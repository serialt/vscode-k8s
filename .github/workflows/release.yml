name: Create GitHub Release

# Builds a VSIX and attaches it to a GitHub release for the version declared
# in package.json. Marketplace publishing remains handled by the 1ES pipeline.
on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Release VSIX
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run test-compile

      - name: Get package version
        id: package_version
        run: echo "current-version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx vsce package --out "sugar-kubernetes-tools-${{ steps.package_version.outputs.current-version }}.vsix"

      - name: Read release notes
        id: changelog_reader
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          version: ${{ steps.package_version.outputs.current-version }}
          path: CHANGELOG.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.package_version.outputs.current-version }}
          name: ${{ steps.package_version.outputs.current-version }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          files: sugar-kubernetes-tools-${{ steps.package_version.outputs.current-version }}.vsix
